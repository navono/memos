[project]
name = "memos-agent"
version = "0.1.0"
description = "AI Agent service for Memos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
    "aiosqlite>=0.20.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
    "deepagents>=0.1.0",
    "langchain-openai>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
